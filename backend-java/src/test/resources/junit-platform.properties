# Configuration Cucumber (moteur cucumber-junit-platform-engine).
# La decouverte du/des fichier(s) .feature est faite par la classe RunCucumberTest
# (@SelectClasspathResource). Ici on ne configure que la glue et l'affichage.

cucumber.glue=fr.dev.sensei.guild.keeper.cucumber
# surefire compte "Tests run: 0" pour la suite (limitation connue) : on genere en
# plus un rapport JUnit par scenario, remonte par la CI.
cucumber.plugin=pretty, summary, junit:target/cucumber-reports/Cucumber.xml
cucumber.publish.quiet=true
